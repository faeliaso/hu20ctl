[package]
name = "hu20-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hu20-core = { path = "../crates/hu20-core" }
hu20-driver = { path = "../crates/hu20-driver" }

[[bin]]
name = "fuzz_target_frame"
path = "fuzz_targets/fuzz_target_frame.rs"
test = false
doc = false

[[bin]]
name = "fuzz_target_template"
path = "fuzz_targets/fuzz_target_template.rs"
test = false
doc = false
